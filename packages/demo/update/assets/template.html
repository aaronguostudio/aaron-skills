<!-- head -->
<title>{{TITLE}}</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f5f6f8;
    --sheet: #ffffff;
    --ink: #1b2230;
    --muted: #5a6374;
    --rule: #dde2ea;
    --accent: #1f4fbf;
    --accent-ink: #ffffff;
    --ok: #1d7a4b;
    --code: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #11151c;
      --sheet: #181d27;
      --ink: #e6e9ef;
      --muted: #9aa3b4;
      --rule: #2b3343;
      --accent: #86a6f5;
      --accent-ink: #0d1220;
      --ok: #5ccf94;
      --code: #222a39;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #11151c;
    --sheet: #181d27;
    --ink: #e6e9ef;
    --muted: #9aa3b4;
    --rule: #2b3343;
    --accent: #86a6f5;
    --accent-ink: #0d1220;
    --ok: #5ccf94;
    --code: #222a39;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px 48px; display: grid; gap: 16px; }
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
    background: var(--paper); padding: 14px 0 12px; border-bottom: 1px solid var(--rule);
  }
  .bar h1 { font-size: 15px; font-weight: 600; margin: 0; text-wrap: balance; }
  .bar p { margin: 2px 0 0; color: var(--muted); font-size: 13px; max-width: 60ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    border-radius: 6px; padding: 9px 12px; cursor: pointer;
    border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { font-size: 13px; color: var(--ok); min-height: 1.2em; flex-basis: 100%; }
  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 28px clamp(16px, 4vw, 36px); }
  #message { max-width: 68ch; overflow-wrap: anywhere; }
  #message > :first-child { margin-top: 0; }
  #message h2 { font-size: 15px; font-weight: 600; margin: 24px 0 6px; }
  #message h3 { font-size: 14px; font-weight: 600; margin: 18px 0 4px; }
  #message p, #message li { margin: 0 0 10px; }
  #message ol, #message ul { padding-left: 1.4em; margin: 0 0 10px; }
  #message li > ol, #message li > ul { margin-top: 6px; }
  #message blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--rule); color: var(--muted); }
  #message code { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--code); padding: 1px 5px; border-radius: 4px; }
  #message a { color: var(--accent); }
  .shot { margin: 12px 0 22px; }
  .shot img { display: block; max-width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 6px; }
  .shot figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 13px; }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  .video h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .video h3 { font-size: 14px; font-weight: 600; margin: 18px 0 8px; }
  .video video { display: block; width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 6px; background: #000; margin-bottom: 10px; }
  .video a { color: var(--accent); }
  .video code { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
</style>
<!-- body -->
<div class="wrap">
  <header class="bar">
    <div>
      <h1>{{TITLE}}</h1>
      <p>{{HINT}}</p>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="copy-text">Copy text</button>
      {{RICH_BUTTON}}
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
  </header>
  <article class="sheet">
    <div id="message">
{{MESSAGE}}
    </div>
  </article>
  {{VIDEO}}
  <p class="note">Nothing on this page is sent anywhere. The buttons only put the message on your clipboard.</p>
</div>
<script type="application/json" id="plain-text">{{PLAIN_JSON}}</script>
<script>
  (function () {
    var plain = JSON.parse(document.getElementById('plain-text').textContent);
    var message = document.getElementById('message');
    var status = document.getElementById('status');
    var timer;
    function say(text) {
      status.textContent = text;
      clearTimeout(timer);
      timer = setTimeout(function () { status.textContent = ''; }, 3000);
    }
    function legacyCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      return ok;
    }
    function selectMessage() {
      var range = document.createRange();
      range.selectNodeContents(message);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    // The HTML that email and document editors receive: no buttons, pictures at most 640px wide.
    function richHtml() {
      var clone = message.cloneNode(true);
      clone.querySelectorAll('button').forEach(function (b) { b.remove(); });
      var live = message.querySelectorAll('img');
      clone.querySelectorAll('img').forEach(function (img, i) {
        var w = live[i].naturalWidth, h = live[i].naturalHeight;
        if (w && h) {
          var width = Math.min(640, w);
          img.setAttribute('width', String(width));
          img.setAttribute('height', String(Math.round(h * width / w)));
        }
      });
      // Chat editors such as Teams flatten <figure> and <figcaption>, which puts the caption on the
      // picture's line. Plain paragraphs keep the picture and its caption on lines of their own.
      clone.querySelectorAll('figure').forEach(function (figure) {
        var parts = document.createDocumentFragment();
        var picture = document.createElement('p');
        picture.appendChild(figure.querySelector('img'));
        parts.appendChild(picture);
        var caption = (figure.querySelector('figcaption') || {}).textContent || '';
        if (caption.trim()) {
          var line = document.createElement('p');
          var em = document.createElement('em');
          em.textContent = caption.trim();
          line.appendChild(em);
          parts.appendChild(line);
        }
        figure.replaceWith(parts);
      });
      return '<div>' + clone.innerHTML + '</div>';
    }
    // Any screenshot format goes to the clipboard as PNG, the one image type every clipboard accepts.
    function pngOf(img) {
      return new Promise(function (resolve, reject) {
        var canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error('no image')); }, 'image/png');
      });
    }

    document.getElementById('copy-text').addEventListener('click', function () {
      var done = function () { say('Text copied'); };
      var fallback = function () {
        if (legacyCopy(plain)) return done();
        selectMessage();
        say('Selected: press Ctrl+C or ⌘C');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(plain).then(done, fallback);
      else fallback();
    });

    var rich = document.getElementById('copy-rich');
    if (rich) rich.addEventListener('click', function () {
      var fallback = function () { selectMessage(); say('Selected: press Ctrl+C or ⌘C'); };
      if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) return fallback();
      var item = new ClipboardItem({
        'text/html': new Blob([richHtml()], { type: 'text/html' }),
        'text/plain': new Blob([plain], { type: 'text/plain' })
      });
      navigator.clipboard.write([item]).then(function () { say('Text and screenshots copied'); }, fallback);
    });

    document.querySelectorAll('.copy-img').forEach(function (button) {
      button.addEventListener('click', function () {
        var figure = button.closest('figure');
        var img = figure.querySelector('img');
        var n = figure.getAttribute('data-n');
        var blocked = function () { say('Copy blocked here: right-click screenshot ' + n + ' and copy the image'); };
        if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) return blocked();
        var png = pngOf(img);
        // Safari needs the promise form to keep the click's permission; older Chrome needs a Blob.
        navigator.clipboard.write([new ClipboardItem({ 'image/png': png })])
          .catch(function () { return png.then(function (blob) { return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); }); })
          .then(function () { say('Screenshot ' + n + ' copied'); }, blocked);
      });
    });
  })();
</script>
