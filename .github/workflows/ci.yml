name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          brew install ffmpeg
          npm ci
          npm ci --prefix packages/demo/capture
          npm ci --prefix packages/demo/remotion
          python -m pip install -r scripts/requirements.txt
          node packages/demo/capture/node_modules/playwright/cli.js install chromium
      - name: Deterministic checks and public history
        run: npm run check -- --public-history --python python
      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix packages/demo/capture --omit=dev --audit-level=high
          npm audit --prefix packages/demo/remotion --omit=dev --audit-level=high
      - name: Installed smoke
        run: >-
          python scripts/install.py --agent both
          --root "$RUNNER_TEMP/demo install/runtime"
          --bin-dir "$RUNNER_TEMP/demo install/bin" --smoke
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
