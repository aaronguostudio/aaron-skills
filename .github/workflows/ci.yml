name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg; fi
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ffmpeg python3-venv fonts-noto-cjk xvfb; fi
          if [ "$RUNNER_OS" = Windows ]; then choco install ffmpeg -y --no-progress; fi
          npm ci
          npm ci --prefix packages/demo/capture
          npm ci --prefix packages/demo/remotion
          python -m pip install -r scripts/requirements.txt
          node packages/demo/capture/node_modules/playwright/cli.js install chromium
          if [ "$RUNNER_OS" = Linux ]; then node packages/demo/capture/node_modules/playwright/cli.js install-deps chromium; fi
      - name: Runtime versions
        run: |
          node --version
          python --version
          python -c 'import platform; print(platform.platform()); print(platform.machine())'
      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Deterministic checks and public history
        run: npm run check -- --public-history --python python
      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix packages/demo/capture --omit=dev --audit-level=high
          npm audit --prefix packages/demo/remotion --omit=dev --audit-level=high
      - name: Install bundle
        run: >-
          python scripts/install.py --agent codex
          --root "$RUNNER_TEMP/demo install/runtime"
          --bin-dir "$RUNNER_TEMP/demo install/bin"
          --skills-dir "$RUNNER_TEMP/demo install/skills"
      - name: Installed revision, playback and clipboard
        run: |
          release=$(python -c 'import os,sys;from pathlib import Path;sys.path.insert(0,"scripts");from managed_registration import active_release;root=Path(os.environ["RUNNER_TEMP"])/"demo install/runtime";print(active_release(root) if os.name=="nt" else root/"current")')
          node scripts/verify-installed.mjs "$release"
      - name: Installed sign-in and recovery
        run: |
          release=$(python -c 'import os,sys;from pathlib import Path;sys.path.insert(0,"scripts");from managed_registration import active_release;root=Path(os.environ["RUNNER_TEMP"])/"demo install/runtime";print(active_release(root) if os.name=="nt" else root/"current")')
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node scripts/verify-sign-in.mjs "$release"; else node scripts/verify-sign-in.mjs "$release"; fi
          python scripts/verify-lifecycle.py --root "$RUNNER_TEMP/demo install/runtime" --skills-dir "$RUNNER_TEMP/demo install/skills" --bin-dir "$RUNNER_TEMP/demo install/bin"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
